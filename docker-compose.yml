services:
  mysql:
    image: mysql:8.4
    container_name: aquasense-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Falta en .env}
      MYSQL_APP_PASSWORD: ${MYSQL_APP_PASSWORD:?Falta en .env}
      MYSQL_MIGRACIONES_PASSWORD: ${MYSQL_MIGRACIONES_PASSWORD:?Falta en .env}
    ports:
      # Solo local: la app corre en la misma laptop y la base no se expone a la red
      - "127.0.0.1:3306:3306"
    volumes:
      - aquasense_datos:/var/lib/mysql
      - ./docker/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  aquasense_datos:
