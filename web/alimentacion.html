<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Alimentación · AquaSense</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/app.css" />
    <script type="module" src="/js/alimentacion.js"></script>
  </head>
  <body class="min-h-screen bg-slate-100 text-slate-900">
    <header class="bg-sky-900 text-white">
      <div class="mx-auto flex max-w-5xl flex-wrap items-center justify-between gap-3 p-4">
        <p class="text-xl font-bold">AquaSense</p>
        <button
          id="salir"
          type="button"
          class="rounded border border-white px-3 py-2 font-medium hover:bg-sky-800"
        >
          Cerrar sesión
        </button>
        <nav aria-label="Principal" class="w-full overflow-x-auto">
          <ul class="flex gap-1 text-base font-medium">
            <li><a href="/" class="block rounded px-3 py-2 hover:bg-sky-800">Panel</a></li>
            <li><a href="/alertas.html" class="block rounded px-3 py-2 hover:bg-sky-800">Alertas</a></li>
            <li><a href="/alimentacion.html" class="block rounded px-3 py-2 hover:bg-sky-800">Alimentación</a></li>
            <li><a href="/ajustes.html" class="block rounded px-3 py-2 hover:bg-sky-800">Ajustes</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="mx-auto max-w-5xl p-4">
      <h1 class="mb-3 text-2xl font-bold">Alimentación</h1>
      <p id="estado-carga" role="status" class="mb-3 text-slate-700">Cargando…</p>
      <div id="aviso" role="alert" hidden></div>
      <p id="sin-servo" class="mb-4 rounded-lg bg-white p-4 shadow" hidden>Ningún tanque tiene un nodo con alimentador (módulo servo).</p>
      <div id="contenido" hidden>
        <div class="mb-4 rounded-lg bg-white p-4 shadow">
          <label for="tanque" class="mb-1 block font-medium">Tanque</label>
          <select id="tanque" class="w-full rounded border border-slate-500 p-2 text-base"></select>
          <p id="tolva" class="mt-3 text-slate-800"></p>
        </div>

        <section class="mb-4 rounded-lg bg-white p-4 shadow" aria-labelledby="titulo-dispensar">
          <h2 id="titulo-dispensar" class="mb-3 text-xl font-bold">Dispensar ahora</h2>
          <form id="form-dispensar" class="flex flex-wrap items-end gap-3">
            <div>
              <label for="cargas" class="mb-1 block font-medium">Cargas</label>
              <select id="cargas" class="w-full rounded border border-slate-500 p-2 text-base">
                <option value="1">1</option><option value="2">2</option><option value="3">3</option>
                <option value="4">4</option><option value="5">5</option>
              </select>
            </div>
            <button id="dispensar" type="submit" class="rounded bg-sky-800 px-4 py-2 font-semibold text-white hover:bg-sky-900 disabled:bg-slate-500">Dispensar</button>
          </form>
          <p id="estado-comando" role="status" aria-live="polite" class="mt-3 font-medium"></p>
        </section>

        <section class="mb-4 rounded-lg bg-white p-4 shadow" aria-labelledby="titulo-programa">
          <h2 id="titulo-programa" class="mb-3 text-xl font-bold">Programa de alimentación</h2>
          <div id="aviso-programa" role="alert" hidden></div>
          <form id="form-programa">
            <div id="campos-programa"></div>
            <button type="submit" class="rounded bg-sky-800 px-4 py-2 font-semibold text-white hover:bg-sky-900 disabled:bg-slate-500">Guardar</button>
          </form>
        </section>

        <section class="mb-4 rounded-lg bg-white p-4 shadow" aria-labelledby="titulo-bitacora">
          <h2 id="titulo-bitacora" class="mb-3 text-xl font-bold">Bitácora de dosis</h2>
          <p id="bitacora-vacia" class="text-slate-700" hidden>Todavía no hay dosis registradas.</p>
          <ul id="bitacora" class="divide-y divide-slate-200"></ul>
        </section>
      </div>
    </main>
  </body>
</html>
